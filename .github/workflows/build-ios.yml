name: Build iOS IPA (sin firmar)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Generar iconos y splash
        run: |
          if [ -d assets ]; then npx capacitor-assets generate --ios || true; fi
      - name: Preparar plataforma iOS
        run: |
          [ -d ios ] || npx cap add ios
          npx cap sync ios
      - name: Ajustar Info.plist
        run: |
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName SIIPOL" $P || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string SIIPOL" $P
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $P || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" $P
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" $P
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" $P || true
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool true" $P || /usr/libexec/PlistBuddy -c "Set :UIViewControllerBasedStatusBarAppearance true" $P
      - name: Compilar
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -archivePath ../../build/App.xcarchive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO archive
      - name: Empaquetar IPA
        run: |
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -qr SIIPOL-Jefatura.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SIIPOL-Jefatura-iOS-IPA
          path: build/SIIPOL-Jefatura.ipa
          retention-days: 7