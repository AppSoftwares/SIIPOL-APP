const K=(o,keys)=>{
 const arr=Array.isArray(keys)?keys:[keys];
 const objKeys=Object.keys(o);
 for(const k of arr){
  const foundKey=objKeys.find(x=>x.toUpperCase().replace(/\s+/g,' ').includes(k.toUpperCase()));
  if(foundKey&&o[foundKey]!==undefined&&o[foundKey]!==null&&String(o[foundKey]).trim()!=='')return String(o[foundKey]).trim();
 }
 return '';
};
const D=v=>{if(v instanceof Date)return new Date(v.getTime()+432e5).toISOString().slice(0,10);
 const m=String(v).match(/(\d{1,2})[\/-](\d{4})/);return m?`${m[3]}-${m[2].padStart(2,0)}-${m[1].padStart(2,0)}`:''};
function ingest(rows){let n=0;rows.forEach(o=>{
 const nombre=K(o,['APELLIDO','NOMBRE','FUNCIONARIO','PERSONA']);if(!nombre)return;
 const fnRaw=o[Object.keys(o).find(x=>['F/N','NACIMIENTO','FECHA NAC','NACIM'].some(k=>x.toUpperCase().includes(k)))]||K(o,['F/N','NACIMIENTO','FECHA NAC']);
 const p={
  nombre,
  ci:K(o,['CÉDULA','CEDULA','CI','DNI']),
  fn:D(fnRaw),
  org:K(o,['CUERPO','ORGANISMO','INSTITUCION','POLICIA']),
  cred:K(o,['CREDENCIAL','PLACA','CARNET','N° CRED']),
  rango:K(o,['RANGO','JERARQUIA','CARGO','TITULO']),
  ofi:K(o,['OFICINA','ADSCRIPCIÓN','ADSCRIPCION','DEPENDENCIA','DEPARTAMENTO','DESPACHO']),
  mail:K(o,['CORREO','EMAIL','POR FAVOR','MAIL']).toLowerCase(),
  tel:K(o,['TELÉFONO','TELEFONO','CELULAR','MOVIL','TELF']),
  siipol:K(o,['USUARIO SIIPOL','USUARIO','SIIPOL']),
  est:K(o,['ESTATUS','ESTADO','CONDICION']),
  sangre:K(o,['SANGRE','TIPO DE SANGRE','GRUPO SANGUINEO']),
  arma:K(o,['ARMA','PORTE','ASIGNACIÓN','EQUIPO']),
  nota:K(o,['OBSERVAC','NOTA','DETALLE'])
 };
 const i=S.p.findIndex(x=>(x.ci&&p.ci&&x.ci===p.ci)||(x.nombre.toLowerCase()===p.nombre.toLowerCase()));
 if(i>=0)S.p[i]={...S.p[i],...p,vac:S.p[i].vac,nota:p.nota||S.p[i].nota,arma:p.arma||S.p[i].arma};
 else S.p.push(p);n++});
 S.cfg.last=Date.now();snap();save();return n}

<div class="barcode">
<div><b>JEFATURA DE SERVICIO SIIPOL - VEN 9-1-1 ZULIA</b><br><small>Documento confidencial generado para uso estrictamente oficial.</small></div>
<div style="text-align:right"><span style="font-family:monospace;font-weight:bold;letter-spacing:3px">||| | ||||| ||| |||| ||</span><br><small>${expNum}</small></div>
</div>
</div></div>`};
const dtxt=p=>`FICHA DE PERSONAL - SIIPOL VEN 9-1-1\n-----------------------------------\nFuncionario: ${p.nombre}\nC.I.: ${p.ci}\nEdad: ${edad(p.fn)} (${fmt(p.fn)})\nSangre: ${p.sangre||'—'}\nOrganismo: ${orgOf(p)}\nRango: ${p.rango||'—'}\nCredencial: ${p.cred||'—'}\nAdscripción: ${p.ofi||'—'}\nArma Asignada: ${p.arma||'—'}\nTeléfono: ${p.tel||'—'}\nCorreo: ${p.mail||'—'}\nUsuario SIIPOL: ${p.siipol||'—'}\nEstatus: ${onVac(p)?'De vacaciones hasta '+fmt(p.vac.h):(p.est||'Activo')}\nNotas: ${p.nota||'—'}`;
const dpdf=async()=>{if(isNative()&&await shareNative('Ficha '+S.p[PI].nombre,dtxt(S.p[PI])))return;H($('#pr'),dos(S.p[PI]));print()};
const dsend=k=>{const p=S.p[PI];window.O={t:'Ficha '+p.nombre,txt:dtxt(p),mail:p.mail};k=='wa'?wa():ml()};
let PI=0;
function ficha(i){const p=S.p[i];PI=i;const c="$('#md').classList.remove('on')";
 H($('#mb'),dos(p)+`<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
  <button class="b" onclick="dpdf()">Descargar PDF</button>
  <button class="b s" onclick="dsend('wa')">WhatsApp</button>
  <button class="b s" onclick="dsend('ml')">Correo</button>
  <button class="b s" onclick="${c}">Cerrar</button>
</div>
<details style="margin-top:12px;background:var(--c);padding:12px;border:1px solid var(--l);border-radius:8px">
  <summary style="cursor:pointer;font-weight:bold;color:var(--g)">✏️ Editar / Completar Datos / Vacaciones</summary>
  <div style="margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px">
    <div><small style="color:var(--m)">Cédula</small><input id="e_ci" value="${esc(p.ci||'')}"></div>
    <div><small style="color:var(--m)">Rango</small><input id="e_rango" value="${esc(p.rango||'')}"></div>
    <div><small style="color:var(--m)">Credencial / Placa</small><input id="e_cred" value="${esc(p.cred||'')}"></div>
    <div><small style="color:var(--m)">Oficina / Adscripción</small><input id="e_ofi" value="${esc(p.ofi||'')}"></div>
    <div><small style="color:var(--m)">Teléfono</small><input id="e_tel" value="${esc(p.tel||'')}"></div>
    <div><small style="color:var(--m)">Correo</small><input id="e_mail" value="${esc(p.mail||'')}"></div>
    <div><small style="color:var(--m)">Usuario SIIPOL</small><input id="e_siipol" value="${esc(p.siipol||'')}"></div>
    <div><small style="color:var(--m)">Tipo de Sangre</small><input id="e_sangre" value="${esc(p.sangre||'')}"></div>
    <div style="grid-column:span 2"><small style="color:var(--m)">Arma Asignada / Porte</small><input id="e_arma" value="${esc(p.arma||'')}"></div>
  </div>
  <hr style="margin:10px 0;border:0;border-top:1px solid var(--l)">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
    <div><small style="color:var(--m)">Vacaciones Desde</small><input type="date" id="vd" value="${esc(p.vac?.d||'')}"></div>
    <div><small style="color:var(--m)">Vacaciones Hasta (regreso)</small><input type="date" id="vh" value="${esc(p.vac?.h||'')}"></div>
  </div>
  <small style="color:var(--m)">Notas u Observaciones</small>
  <textarea id="nt" rows="2" placeholder="Notas">${esc(p.nota||'')}</textarea>
  <div style="margin-top:8px;display:flex;gap:8px">
    <button class="b" onclick="saveFicha(${i})">Guardar Cambios</button>
    <button class="b s" onclick="delete S.p[${i}].vac;save();${c};go('per')">Quitar vacaciones</button>
  </div>
</details>`);$('#md').classList.add('on')}

function saveFicha(i){const q=S.p[i];
 q.ci=$('#e_ci').value;q.rango=$('#e_rango').value;q.cred=$('#e_cred').value;
 q.ofi=$('#e_ofi').value;q.tel=$('#e_tel').value;q.mail=$('#e_mail').value;
 q.siipol=$('#e_siipol').value;q.sangre=$('#e_sangre').value;q.arma=$('#e_arma').value;
 q.nota=$('#nt').value;
 if($('#vd').value&&$('#vh').value)q.vac={d:$('#vd').value,h:$('#vh').value};
 save();$('#md').classList.remove('on');go('per')}
function jf(){const q=$('#jq').value.toLowerCase();H($('#jl'),LEY.filter(a=>(a[0]+a[1]).toLowerCase().includes(q)).map(a=>`<div class="r" style="cursor:default"><b>${a[0]}</b><span style="flex:1">${a[1]}</span></div>`).join(''))}
$('#md').onclick=e=>{if(e.target.id=='md')e.target.classList.remove('on')};
addEventListener('online',()=>sync());

/* Inicializar siempre pantalla de bloqueo / seguridad */
checkAuth();
</script></body></html>
