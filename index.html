<header><b>Jefatura del Servicio SIIPOL</b><small>VEN 9-1-1 · Estado Zulia</small></header>
<main id="v"></main>
<nav id="nav"></nav><div id="md"><div id="mb"></div></div><div id="pr"></div>
<script src="xlsx.full.min.js"></script>
<script>if(typeof XLSX==='undefined')document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>')</script>
<script>
const $=s=>document.querySelector(s),H=(e,h)=>e.innerHTML=h;
const ORG=['FANB','CPBEZ','Polimaracaibo','Polimara','Poliguajira','Polilagunillas','Policabimas','Polisur','Poliurdaneta','Policon','CICPC'];
const orgMatch=(pOrg,o)=>{if(!pOrg||!o)return true;const po=pOrg.toLowerCase(),target=o.toLowerCase();
 if(target==='fanb')return po.includes('fanb')||po.includes('armada')||po.includes('ejército')||po.includes('ejercito')||po.includes('gnb');
 if(target==='cpbez')return po.includes('cpbez')||po.includes('cpbdez');
 if(target==='poliguajira')return po.includes('poliguajira')||po.includes('poliguagira');
 if(target==='poliurdaneta')return po.includes('poliurdaneta')||po.includes('policañada')||po.includes('policanada');
 return po.includes(target);};
const today=()=>{const d=new Date();return d.toISOString().slice(0,10)};
const fmt=d=>d?d.split('-').reverse().join('/'):'—';
const onVac=(p,d=today())=>p.vac&&p.vac.d<=d&&d<=p.vac.h;
const orgOf=p=>p.org||'Sin organismo';
const SAMPLE_OFFICERS=[
 {nombre:"PÉREZ RODRÍGUEZ, CARLOS ALBERTO",ci:"V-18.452.910",fn:"1988-05-14",org:"CPBEZ",rango:"SUPERINTENDENTE",cred:"CPBEZ-4821",ofi:"CENTRO DE COORDINACIÓN POLICIAL N.º 1 MARACAIBO",tel:"0414-6123456",mail:"cperez@cpbez.gob.ve",siipol:"CPEREZ_SIIPOL",sangre:"O POSITIVO (O+)",arma:"PISTOLA GLOCK 17 CAL 9MM N.º EAK902",est:"ACTIVO",nota:"Oficial comisionado para la Sala Situacional SIIPOL VEN 9-1-1 Zulia."},
 {nombre:"GONZÁLEZ MENDOZA, MARÍA ELENA",ci:"V-20.114.832",fn:"1991-08-24",org:"CICPC",rango:"DETECTIVE JEFE",cred:"CICPC-99102",ofi:"DELEGACIÓN MUNICIPAL MARACAIBO",tel:"0424-6789012",mail:"mgonzalez@cicpc.gob.ve",siipol:"MGONZALEZ_SIIPOL",sangre:"A POSITIVO (A+)",arma:"PISTOLA TANFOGLIO FORCE 99 CAL 9MM N.º T84920",est:"ACTIVO",nota:"Coordinadora de enlace operativo SIIPOL."},
 {nombre:"FERNÁNDEZ SUÁREZ, JOSÉ LUIS",ci:"V-16.789.201",fn:"1985-11-30",org:"FANB",rango:"MAYOR (GNB)",cred:"GNB-33910",ofi:"COMANDO DE ZONA N.º 11 ZULIA",tel:"0412-5432109",mail:"jfernandez@gnb.mil.ve",siipol:"JFERNANDEZ_SIIPOL",sangre:"O NEGATIVO (O-)",arma:"PISTOLA BROWNING GP-35 CAL 9MM N.º B71209",est:"ACTIVO",vac:{d:today(),h:new Date(Date.now()+5*864e5).toISOString().slice(0,10)},nota:"Actualmente de vacaciones de servicio."}
];
const DEF={p:SAMPLE_OFFICERS,snap:{},cfg:{url:'',last:0,firma:'Jefatura del Servicio SIIPOL, VEN 9-1-1 Zulia',
 fechas:[{n:'Aniversario de la Armada',d:'07-24',o:'Armada'},{n:'Aniversario del Ejército (Batalla de Carabobo)',d:'06-24',o:'Ejército'},{n:'Aniversario de la GNB',d:'08-04',o:'GNB'},{n:'Día del Policía',d:'11-25',o:''}]}};
let S=JSON.parse(localStorage.getItem('sj')||'null')||DEF;
if(!S.p||S.p.length===0){S.p=SAMPLE_OFFICERS;save();}
/* ---------- importación ---------- */
const K=(o,keys)=>{
 const arr=Array.isArray(keys)?keys:[keys];
 const objKeys=Object.keys(o);
 for(const k of arr){
  const foundKey=objKeys.find(x=>x.toUpperCase().replace(/\s+/g,' ').includes(k.toUpperCase()));
  if(foundKey&&o[foundKey]!==undefined&&o[foundKey]!==null&&String(o[foundKey]).trim()!=='')return String(o[foundKey]).trim();
 }
 return '';
};
const D=v=>{if(v instanceof Date)return new Date(v.getTime()+432e5).toISOString().slice(0,10);
 const m=String(v).match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);return m?`${m[3]}-${m[2].padStart(2,0)}-${m[1].padStart(2,0)}`:''};
function ingest(rows){let n=0;rows.forEach(o=>{
 const nombre=K(o,['APELLIDO','NOMBRE','FUNCIONARIO','PERSONA']);if(!nombre)return;
 const fnRaw=o[Object.keys(o).find(x=>['F/N','NACIMIENTO','FECHA NAC','NACIM'].some(k=>x.toUpperCase().includes(k)))]||K(o,['F/N','NACIMIENTO','FECHA NAC']);
 const p={
  nombre,
  ci:K(o,['CÉDULA','CEDULA','CI','DNI']),
  fn:D(fnRaw),
  org:K(o,['CUERPO','ORGANISMO','INSTITUCION','POLICIA']),
  cred:K(o,['CREDENCIAL','PLACA','CARNET','N° CRED']),
  rango:K(o,['RANGO','JERARQUIA','CARGO','TITULO']),
  ofi:K(o,['OFICINA','ADSCRIPCIÓN','ADSCRIPCION','DEPENDENCIA','DEPARTAMENTO','DESPACHO']),
  mail:K(o,['CORREO','EMAIL','POR FAVOR','MAIL']).toLowerCase(),
  tel:K(o,['TELÉFONO','TELEFONO','CELULAR','MOVIL','TELF']),
  siipol:K(o,['USUARIO SIIPOL','USUARIO','SIIPOL']),
  est:K(o,['ESTATUS','ESTADO','CONDICION']),
  sangre:K(o,['SANGRE','TIPO DE SANGRE','GRUPO SANGUINEO']),
  arma:K(o,['ARMA','PORTE','ASIGNACIÓN','EQUIPO']),
  nota:K(o,['OBSERVAC','NOTA','DETALLE'])
 };
 const i=S.p.findIndex(x=>(x.ci&&p.ci&&x.ci===p.ci)||(x.nombre.toLowerCase()===p.nombre.toLowerCase()));
 if(i>=0)S.p[i]={...S.p[i],...p,vac:S.p[i].vac,nota:p.nota||S.p[i].nota,arma:p.arma||S.p[i].arma};
 else S.p.push(p);n++});
 S.cfg.last=Date.now();snap();save();return n}
function snap(){const k=today().slice(0,7),by={};S.p.forEach(p=>by[orgOf(p)]=(by[orgOf(p)]||0)+1);
 S.snap[k]={t:S.p.length,v:S.p.filter(p=>onVac(p)).length,by}}
async function sync(manual){if(!S.cfg.url){if(manual)alert('Configura primero el enlace CSV de la hoja de Google.');return}
 try{const r=await fetch(S.cfg.url);const wb=XLSX.read(await r.text(),{type:'string',cellDates:true});
 const n=ingest(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]));if(manual)alert(n+' registros sincronizados');go(cur)}
 catch(e){if(manual)alert('Sin conexión o enlace inválido. Se mantienen los datos guardados.')}}
function loadFile(f){const r=new FileReader();r.onload=e=>{const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
 alert(ingest(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]))+' registros importados');go('ini')};r.readAsArrayBuffer(f)}
/* ---------- salida: PDF / WhatsApp / correo ---------- */
function out(t,txt,mail=''){H($('#mb'),`<h2>${t}</h2><pre>${txt.replace(/</g,'&lt;')}</pre>
<button class="b" onclick="pdf()">PDF / Imprimir</button>
<button class="b s" onclick="wa()">WhatsApp</button>
<button class="b s" onclick="ml()">Correo</button>
<button class="b s" onclick="cp()">Copiar</button><button class="b s" onclick="$('#md').classList.remove('on')">Cerrar</button>`);
 window.O={t,txt,mail};$('#md').classList.add('on')}
const pdf=()=>{H($('#pr'),`<h1>${O.t}</h1><pre>${O.txt.replace(/</g,'&lt;')}</pre><p>${S.cfg.firma}</p>`);print()};
const wa=()=>open('https://wa.me/?text='+encodeURIComponent(O.t+'\n\n'+O.txt));
const ml=()=>location.href=`mailto:${O.mail}?subject=${encodeURIComponent(O.t)}&body=${encodeURIComponent(O.txt+'\n\n'+S.cfg.firma)}`;
const cp=()=>navigator.clipboard.writeText(O.txt);
function parte(d){const a=S.p.filter(p=>!onVac(p,d)),v=S.p.filter(p=>onVac(p,d));
 out('Parte del servicio SIIPOL · '+fmt(d),`Total: ${S.p.length} | Activos: ${a.length} | De vacaciones: ${v.length}\n\nDE VACACIONES:\n`+
 (v.map(p=>`- ${p.nombre} (${orgOf(p)}) regresa ${fmt(p.vac.h)}`).join('\n')||'Ninguno')+'\n\nPOR ORGANISMO:\n'+
 ORG.map(o=>`${o}: ${a.filter(p=>orgMatch(p.org,o)).length}`).join('\n'))}
/* ---------- fechas ---------- */
const bd=(p)=>{if(!p.fn)return 999;const n=new Date(),[y,m,d]=p.fn.split('-').map(Number);let x=new Date(n.getFullYear(),m-1,d);
 if(x<new Date(n.getFullYear(),n.getMonth(),n.getDate()))x=new Date(n.getFullYear()+1,m-1,d);return Math.round((x-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/864e5)};
const felic=p=>out('Felicitaciones por su cumpleaños',`Estimado(a) ${p.rango} ${p.nombre}:\n\nLa Jefatura del Servicio SIIPOL del VEN 9-1-1 Zulia le desea un feliz cumpleaños, junto con éxitos en su labor al servicio de la ciudadanía.\n\nFeliz día.`,p.mail);
const felicOrg=(f)=>out(f.n,`Estimado personal:\n\nEn ocasión de ${f.n.toLowerCase()}, la Jefatura del Servicio SIIPOL del VEN 9-1-1 Zulia les extiende su reconocimiento por su compromiso y dedicación.\n\nFeliz día.`,
 S.p.filter(p=>!f.o||p.org.includes(f.o)).map(p=>p.mail).filter(Boolean).join(','));
/* ---------- jurídico y planillas ---------- */
const LEY=[['Art. 1','El SIIPOL es de uso exclusivo del CICPC.'],['Art. 2','Solo el titular de la Dirección General Nacional del CICPC puede facilitar su información a organismos policiales que coadyuven en la investigación penal.'],['Art. 3','El titular de la Dirección General podrá autorizar mecanismos de intercambio de información con instituciones en materia científica, penal y criminalística.'],['Art. 4','El CICPC promoverá el fortalecimiento del centro de información estratégico, para regularizar el uso del sistema.'],['Art. 5','Dentro de 60 días hábiles se crearán protocolos y manuales internos de uso, control y supervisión; solo modificables por innovaciones tecnológicas.'],['Art. 6','Se harán supervisiones y auditorías permanentes del uso correcto del SIIPOL.'],['Art. 7','El funcionario del CICPC en comisión de servicio en otras instituciones no podrá usar el SIIPOL.'],['Art. 8','Los usuarios autorizados están sujetos a los protocolos internos de uso, control y supervisión.'],['Art. 9','El uso indebido o no autorizado acarrea sanciones administrativas, penales y civiles.'],['Art. 10','Vigencia desde su publicación en Gaceta Oficial.']];
const PLAN={'Solicitud de usuario SIIPOL':'SOLICITUD DE USUARIO SIIPOL\n\nApellidos y nombres:\nC.I.:\nOrganismo:\nRango / Jerarquía:\nN.º de credencial:\nOficina de adscripción:\nCorreo:\nTeléfono:\n\nDeclaro conocer las normas de uso del SIIPOL.\n\nFirma: ____________   Fecha: ____/____/______',
'Compromiso de confidencialidad':'COMPROMISO DE CONFIDENCIALIDAD\n\nYo, ______________, C.I. ______________, me comprometo a usar el SIIPOL solo para fines de investigación penal autorizados, y a no divulgar su información. Conozco que el uso indebido acarrea sanciones administrativas, penales y civiles (Art. 9, Res. N.º 196, Gaceta Oficial N.º 40.422).\n\nFirma: ____________   Fecha: ____/____/______',
'Bienvenida a nuevo usuario':'Bienvenido(a) a la Sala SIIPOL del VEN 9-1-1 Zulia.\n\nPara su registro, envíe: nombre completo, cédula, organismo, credencial, rango, oficina, correo y teléfono, y complete el formulario de actualización de datos del personal.'};
/* ---------- vistas ---------- */
let cur='ini';const TABS=[['ini','Inicio'],['per','Personal'],['est','Estadísticas'],['fec','Fechas'],['jur','Jurídico'],['cfg','Ajustes']];
const stat=p=>onVac(p)?`<span class="tag v">Vacaciones · regresa ${fmt(p.vac.h)}</span>`:'<span class="tag">Activo</span>';
function go(t){cur=t;H($('#nav'),TABS.map(x=>`<button class="${x[0]==t?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join(''));const v=$('#v');
 if(t=='ini'){const v1=S.p.filter(p=>onVac(p)),ret=S.p.filter(p=>p.vac&&p.vac.h>=today()&&p.vac.h<=new Date(Date.now()+7*864e5).toISOString().slice(0,10)),b=S.p.filter(p=>bd(p)==0);
 H(v,`<h2>Resumen</h2><div class="k"><div><b>${S.p.length}</b><span>Funcionarios</span></div><div><b>${S.p.length-v1.length}</b><span>Activos</span></div><div><b>${v1.length}</b><span>De vacaciones</span></div><div><b>${b.length}</b><span>Cumplen hoy</span></div></div>
 ${S.p.length?'':'<div class="card">Aún no hay datos. Ve a <b>Ajustes</b> e importa tu Excel o enlaza la hoja de Google.</div>'}
 <div class="card"><h3>Regresan en 7 días</h3>${ret.map(p=>`<div class="r"><span>${p.nombre}<br><small>${orgOf(p)}</small></span><small>${fmt(p.vac.h)}</small></div>`).join('')||'<small>Nadie por ahora.</small>'}</div>
 <div class="card"><h3>Parte del servicio por fecha</h3><input type="date" id="pd" value="${today()}"><button class="b" onclick="parte($('#pd').value)">Generar parte</button></div>
 ${b.length?`<div class="card"><h3>Cumpleaños de hoy</h3>${b.map(p=>`<div class="r" onclick="felic(S.p[${S.p.indexOf(p)}])"><span>${p.nombre}</span><span class="tag">Felicitar</span></div>`).join('')}</div>`:''}`)}
 if(t=='per'){H(v,`<h2>Personal</h2><input id="q" placeholder="Buscar nombre, cédula, credencial…" oninput="lst()"><select id="fo" onchange="lst()"><option value="">Todos los organismos</option>${ORG.map(o=>`<option>${o}</option>`).join('')}</select><div class="card" id="ls"></div>`);lst()}
 if(t=='est'){const mx=Math.max(1,...ORG.map(o=>S.p.filter(p=>orgMatch(p.org,o)).length)),ks=Object.keys(S.snap).sort(),a=S.snap[ks[ks.length-1]],b=S.snap[ks[ks.length-2]];
 H(v,`<h2>Estadísticas</h2><div class="card"><h3>Funcionarios por organismo</h3>${ORG.map(o=>{const n=S.p.filter(p=>orgMatch(p.org,o)).length,q=b?b.by[o]||0:0;
 return`<div class="bar"><span>${o}</span><i style="width:${n/mx*55}%"></i>${b?`<i class="p" style="width:${q/mx*55}%;opacity:.6"></i>`:''}<b>${n}</b></div>`}).join('')}${b?'<small>Barra dorada: mes anterior</small>':''}</div>
 <div class="card"><h3>Comparación mensual</h3>${a?`Mes ${ks[ks.length-1]}: <b>${a.t}</b> funcionarios, <b>${a.v}</b> de vacaciones.<br>`:'Sin datos.'}${b?`Mes ${ks[ks.length-2]}: <b>${b.t}</b> funcionarios, <b>${b.v}</b> de vacaciones. Variación: <b>${a.t-b.t>=0?'+':''}${a.t-b.t}</b>`:'<small>La comparación aparece al cerrar el primer mes.</small>'}</div>
 <button class="b" onclick="out('Estadística SIIPOL',ORG.map(o=>o+': '+S.p.filter(p=>orgMatch(p.org,o)).length).join('\\n'))">Exportar / enviar</button>`)}
 if(t=='fec'){const l=S.p.filter(p=>p.fn).sort((a,b)=>bd(a)-bd(b)).slice(0,25);
 H(v,`<h2>Cumpleaños próximos</h2><div class="card">${l.map(p=>`<div class="r" onclick="felic(S.p[${S.p.indexOf(p)}])"><span>${p.nombre}<br><small>${orgOf(p)}</small></span><span><small>${fmt(p.fn).slice(0,5)}</small> <span class="tag">${bd(p)==0?'Hoy':'en '+bd(p)+' d'}</span></span></div>`).join('')||'<small>Sin fechas de nacimiento.</small>'}</div>
 <h2>Fechas institucionales</h2><div class="card">${S.cfg.fechas.map((f,i)=>`<div class="r" onclick="felicOrg(S.cfg.fechas[${i}])"><span>${f.n}<br><small>Verifica la fecha en Ajustes</small></span><span class="tag">${f.d.split('-').reverse().join('/')}</span></div>`).join('')}</div>
 <div class="card"><small>Al tocar, se prepara el mensaje institucional para enviarlo por correo o WhatsApp. El envío 100 % automático sin servidor no es posible; la app te avisa en Inicio y lo envías con un toque.</small></div>`)}
 if(t=='jur'){H(v,`<h2>Jurídico</h2><input id="jq" placeholder="Buscar en las normas…" oninput="jf()"><div class="card" id="jl"></div>
 <div class="card"><small>Resolución N.º 196 (27/05/2014), Gaceta Oficial N.º 40.422 del 29/05/2014. Resumen; consulta el texto oficial.</small></div>
 <h2>Planillas</h2><div class="card">${Object.keys(PLAN).map(k=>`<div class="r" onclick="out('${k}',PLAN['${k}'])"><span>${k}</span><span class="tag">Abrir</span></div>`).join('')}</div>
 <h2>Notas jurídicas</h2><textarea id="jn" rows="4" placeholder="Tus criterios y precedentes…" onchange="S.cfg.nj=this.value;save()">${S.cfg.nj||''}</textarea>`);jf()}
 if(t=='cfg'){H(v,`<h2>Ajustes</h2><div class="card"><h3>Importar Excel / CSV</h3><input type="file" accept=".xlsx,.xls,.csv" onchange="loadFile(this.files[0])"></div>
 <div class="card"><h3>Datos de Prueba</h3><button class="b" onclick="S.p=JSON.parse(JSON.stringify(SAMPLE_OFFICERS));save();alert('Funcionarios de ejemplo cargados');go('per')">Cargar Funcionarios de Ejemplo</button>
 <button class="b s" onclick="if(confirm('¿Deseas borrar toda la lista de funcionarios?')){S.p=[];save();go('ini')}">Borrar Todo</button></div>
 <div class="card"><h3>Sincronización semanal</h3><small>En Google Sheets: Archivo → Compartir → Publicar en la web → CSV. Pega el enlace.</small><input id="u" value="${S.cfg.url}" placeholder="https://docs.google.com/…/pub?output=csv" onchange="S.cfg.url=this.value;save()">
 <button class="b" onclick="sync(true)">Sincronizar ahora</button><br><small>Última: ${S.cfg.last?new Date(S.cfg.last).toLocaleString():'nunca'}</small></div>
 <div class="card"><h3>Firma de mensajes</h3><input value="${S.cfg.firma}" onchange="S.cfg.firma=this.value;save()"></div>
 <div class="card"><h3>Respaldo</h3><button class="b s" onclick="out('Respaldo JSON',JSON.stringify(S))">Exportar datos</button></div>`)}}
function lst(){const q=$('#q').value.toLowerCase(),o=$('#fo').value;
 H($('#ls'),S.p.map((p,i)=>[p,i]).filter(([p])=>(!o||orgMatch(p.org,o))&&(p.nombre+p.ci+p.cred).toLowerCase().includes(q)).slice(0,80).map(([p,i])=>`<div class="r" onclick="ficha(${i})"><span>${p.nombre}<br><small>${p.rango} · ${orgOf(p)}</small></span>${stat(p)}</div>`).join('')||'<small>Sin resultados.</small>')}
const edad=f=>{if(!f)return'—';const n=new Date(),b=new Date(f);let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a};
const dos=p=>{
 const R=(l,v)=>`<div class="fr-box"><b>${l}</b><span>${v||'<i style="color:#64748b;font-weight:normal">SIN REGISTRAR</i>'}</span></div>`;
 const expNum=`EXP-${p.ci?p.ci.replace(/\D/g,''):'0000'}-${new Date().getFullYear()}`;
 const nowFmt=new Date().toLocaleString('es-VE');
 const estTxt=onVac(p)?`DE VACACIONES (DESDE ${fmt(p.vac.d)} HASTA ${fmt(p.vac.h)})`:(p.est?p.est.toUpperCase():'ACTIVO / DISPONIBLE');
 const estCls=onVac(p)?'color:#b91c1c;font-weight:bold;':'color:#15803d;font-weight:bold;';
 return `<div class="fd"><div class="pp"><svg class="clip" width="34" height="72" viewBox="0 0 34 72"><path d="M10 44V15a7 7 0 0 1 14 0v42a11 11 0 0 1-22 0V22" fill="none" stroke="#8b929c" stroke-width="3" stroke-linecap="round"/></svg>
<small class="ld">FOLIO CONTROL: <b>${expNum}</b> | EMISIÓN: <b>${nowFmt}</b></small>
<div class="stamp">CONFIDENCIAL</div><div class="seal">★<br>USO OFICIAL<br>SIIPOL<br>VEN 9-1-1<br>★</div>
<div style="height:40px"></div>
<div class="pp-hdr">
<h4>República Bolivariana de Venezuela</h4>
<h4>Ministerio del Poder Popular para Relaciones Interiores, Justicia y Paz</h4>
<h3>SISTEMA INTEGRADO DE INFORMACIÓN POLICIAL (SIIPOL)</h3>
<small>SALA SITUACIONAL Y JEFATURA DEL SERVICIO · VEN 9-1-1 ESTADO ZULIA</small>
</div>
<div class="sec-title">I. FILIACIÓN Y DATOS PERSONALES DEL FUNCIONARIO</div>
<div class="grid-2">
${R('Apellidos y Nombres completos',p.nombre)}
${R('Cédula de Identidad',p.ci)}
${R('Fecha de Nacimiento / Edad',p.fn?`${fmt(p.fn)} (${edad(p.fn)} años)`:null)}
${R('Grupo Sanguíneo y Factor RH',p.sangre)}
</div>
<div class="sec-title">II. INFORMACIÓN INSTITUCIONAL, CARGO Y ARMAMENTO</div>
<div class="grid-2">
${R('Organismo / Cuerpo Policial',orgOf(p))}
${R('Rango / Jerarquía / Cargo',p.rango)}
${R('N.º Credencial / Placa / Carnet',p.cred)}
${R('Oficina / Unidad / Adscripción',p.ofi)}
${R('Arma de Fuego Asignada / Porte',p.arma)}
${R('Estatus Operativo Actual',`<span style="${estCls}">${estTxt}</span>`)}
</div>
<div class="sec-title">III. REGISTRO DE SISTEMA Y CONTACTO DIRECTO</div>
<div class="grid-2">
${R('Usuario Registrado en SIIPOL',p.siipol)}
${R('Teléfono Móvil de Contacto',p.tel)}
${R('Correo Electrónico Oficial',p.mail)}
${R('Sincronización en Base de Datos',S.cfg.last?fmt(new Date(S.cfg.last).toISOString().slice(0,10)):'—')}
</div>
<div class="sec-title">IV. HISTORIAL DE PERMISOS Y OBSERVACIONES DE CAMPO</div>
<div style="background:#f8fafc;border:1px solid #cbd5e1;padding:10px 12px;border-radius:4px;min-height:50px;font-family:'Courier New',monospace;font-size:12px;color:#0f172a">
<b>VACACIONES:</b> ${onVac(p)?`En periodo de descanso desde ${fmt(p.vac.d)} hasta ${fmt(p.vac.h)}.`:'Sin vacaciones programadas en curso.'}<br>
<b>NOTAS DE LA JEFATURA:</b> ${p.nota||'Sin observaciones registradas a la fecha.'}
</div>
<div class="sec-title">V. CONFORMIDAD Y AUDITORÍA DE LA SUPERIORIDAD</div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:25px;text-align:center;font-family:system-ui,sans-serif;font-size:10px;color:#334155">
 <div style="border-top:1px solid #0f172a;padding-top:4px">
  <b>${p.nombre||'FUNCIONARIO'}</b><br>
  C.I.: ${p.ci||'—'}<br>
  <i>Firma del Titular</i>
 </div>
 <div style="border-top:1px solid #0f172a;padding-top:4px">
  <b>SUPERVISOR DE SALA SIIPOL</b><br>
  VEN 9-1-1 ZULIA<br>
  <i>Firma y Sello Oficial</i>
 </div>
 <div style="border-top:1px solid #0f172a;padding-top:4px">
  <b>SUPERIORIDAD / COMANDO</b><br>
  JEFATURA DEL SERVICIO<br>
  <i>V.° B.° / Visto Bueno</i>
 </div>
</div>
<div class="barcode">
<div><b>JEFATURA DE SERVICIO SIIPOL - VEN 9-1-1 ZULIA</b><br><small>Documento oficial auditado para control de la superioridad. Generado el ${nowFmt}.</small></div>
<div style="text-align:right"><span style="font-family:monospace;font-weight:bold;letter-spacing:3px">||| | ||||| ||| |||| ||</span><br><small>${expNum}</small></div>
</div>
</div></div>`};
const dtxt=p=>`FICHA DE PERSONAL - SIIPOL VEN 9-1-1\n-----------------------------------\nFuncionario: ${p.nombre}\nC.I.: ${p.ci}\nEdad: ${edad(p.fn)} (${fmt(p.fn)})\nSangre: ${p.sangre||'—'}\nOrganismo: ${orgOf(p)}\nRango: ${p.rango||'—'}\nCredencial: ${p.cred||'—'}\nAdscripción: ${p.ofi||'—'}\nArma Asignada: ${p.arma||'—'}\nTeléfono: ${p.tel||'—'}\nCorreo: ${p.mail||'—'}\nUsuario SIIPOL: ${p.siipol||'—'}\nEstatus: ${onVac(p)?'De vacaciones hasta '+fmt(p.vac.h):(p.est||'Activo')}\nNotas: ${p.nota||'—'}`;
const dpdf=()=>{H($('#pr'),dos(S.p[PI]));print()};
const dsend=k=>{const p=S.p[PI];window.O={t:'Ficha '+p.nombre,txt:dtxt(p),mail:p.mail};k=='wa'?wa():ml()};
let PI=0;
function ficha(i){const p=S.p[i];PI=i;const c="$('#md').classList.remove('on')";
 H($('#mb'),dos(p)+`<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
  <button class="b" onclick="dpdf()">Descargar PDF</button>
  <button class="b s" onclick="dsend('wa')">WhatsApp</button>
  <button class="b s" onclick="dsend('ml')">Correo</button>
  <button class="b s" onclick="${c}">Cerrar</button>
</div>
<details style="margin-top:12px;background:var(--c);padding:12px;border:1px solid var(--l);border-radius:8px">
  <summary style="cursor:pointer;font-weight:bold;color:var(--g)">✏️ Editar / Completar Datos / Vacaciones</summary>
  <div style="margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px">
    <div><small style="color:var(--m)">Cédula</small><input id="e_ci" value="${p.ci||''}"></div>
    <div><small style="color:var(--m)">Rango</small><input id="e_rango" value="${p.rango||''}"></div>

    <div><small style="color:var(--m)">Teléfono</small><input id="e_tel" value="${p.tel||''}"></div>
    <div><small style="color:var(--m)">Correo</small><input id="e_mail" value="${p.mail||''}"></div>
    <div><small style="color:var(--m)">Usuario SIIPOL</small><input id="e_siipol" value="${p.siipol||''}"></div>
    <div><small style="color:var(--m)">Tipo de Sangre</small><input id="e_sangre" value="${p.sangre||''}"></div>
    <div style="grid-column:span 2"><small style="color:var(--m)">Arma Asignada / Porte</small><input id="e_arma" value="${p.arma||''}"></div>
  </div>
  <hr style="margin:10px 0;border:0;border-top:1px solid var(--l)">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
    <div><small style="color:var(--m)">Vacaciones Desde</small><input type="date" id="vd" value="${p.vac?.d||''}"></div>
    <div><small style="color:var(--m)">Vacaciones Hasta (regreso)</small><input type="date" id="vh" value="${p.vac?.h||''}"></div>
  </div>
  <small style="color:var(--m)">Notas u Observaciones</small>
  <textarea id="nt" rows="2" placeholder="Notas">${p.nota||''}</textarea>
  <div style="margin-top:8px;display:flex;gap:8px">
    <button class="b" onclick="saveFicha(${i})">Guardar Cambios</button>
    <button class="b s" onclick="delete S.p[${i}].vac;save();${c};go('per')">Quitar vacaciones</button>
  </div>
</details>`);$('#md').classList.add('on')}

function saveFicha(i){const q=S.p[i];
 q.ci=$('#e_ci').value;q.rango=$('#e_rango').value;q.cred=$('#e_cred').value;
 q.ofi=$('#e_ofi').value;q.tel=$('#e_tel').value;q.mail=$('#e_mail').value;
 q.siipol=$('#e_siipol').value;q.sangre=$('#e_sangre').value;q.arma=$('#e_arma').value;
 q.nota=$('#nt').value;
 if($('#vd').value&&$('#vh').value)q.vac={d:$('#vd').value,h:$('#vh').value};
 save();$('#md').classList.remove('on');go('per')}
function jf(){const q=$('#jq').value.toLowerCase();H($('#jl'),LEY.filter(a=>(a[0]+a[1]).toLowerCase().includes(q)).map(a=>`<div class="r" style="cursor:default"><b>${a[0]}</b><span style="flex:1">${a[1]}</span></div>`).join(''))}
$('#md').onclick=e=>{if(e.target.id=='md')e.target.classList.remove('on')};
addEventListener('online',()=>sync());
go('ini');if(navigator.onLine&&S.cfg.url&&Date.now()-S.cfg.last>7*864e5)sync();
</script></body></html>
